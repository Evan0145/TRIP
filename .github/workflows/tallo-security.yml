name: Tallo security regression
on:
  push:
    paths: ['tallo/**', '.github/workflows/tallo-security.yml']
  pull_request:
    paths: ['tallo/**', '.github/workflows/tallo-security.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: tallo
      - run: npm test
        working-directory: tallo
      - run: npm run test:rules
        working-directory: tallo
