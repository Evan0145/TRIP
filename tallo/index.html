<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅行分帳">
<title>旅行分帳</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  --ink:#1C3A3D; --paper:#EDE6D6; --paper-dark:#E2D9C4; --paper-soft:#F6F2E8;
  --stamp:#B5432E; --brass:#A8823D; --good:#3F6650; --line:#C9BFA6; --hair:#E8E1D0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Inter',-apple-system,'PingFang TC','Noto Sans TC',sans-serif;color-scheme:light;}
body{overscroll-behavior-y:none;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
h1,h2,h3{margin:0;font-family:'Fraunces',serif;font-weight:600;}
button{font-family:inherit;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- 表單元件 ---------- */
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;outline:none;}
input:focus,textarea:focus{border-color:var(--brass);}
input::placeholder,textarea::placeholder{color:var(--ink);opacity:.38;}
textarea{min-height:110px;font-size:13px;font-family:'IBM Plex Mono',monospace;resize:vertical;}
.field{margin-bottom:16px;}
.field-label{font-size:12.5px;opacity:.6;margin-bottom:6px;}
.btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s;}
.btn:active:not(:disabled){transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:default;}
.btn.full{width:100%;}
.btn.primary{background:var(--stamp);color:#fff;}
.btn.brass{background:var(--brass);color:#fff;}
.btn.default{background:var(--paper-dark);color:var(--ink);}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn.danger{background:transparent;color:var(--stamp);border:1.5px solid #B5432E55;}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-size:14px;cursor:pointer;user-select:none;}
.chip.fixed{background:var(--paper);border-color:transparent;cursor:default;}
.chip.selected{background:var(--stamp);color:#fff;border-color:var(--stamp);}
.chip .x{opacity:.55;cursor:pointer;}
.link{color:var(--brass);cursor:pointer;font-size:13px;font-weight:500;}
.badge{font-size:12px;background:var(--paper);border-radius:20px;padding:5px 11px;cursor:pointer;white-space:nowrap;}
.section-label{font-size:12.5px;opacity:.55;margin:22px 0 8px;letter-spacing:.3px;}
.section-label:first-child{margin-top:0;}
.card{background:var(--paper-soft);border:1.5px solid var(--hair);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
.card.tap{cursor:pointer;}
.card.cur{border-color:var(--stamp);background:#FBF3EF;}
.card.muted{opacity:.7;}
.card-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
.card-sub{font-size:12.5px;opacity:.55;margin-top:2px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.notice{background:#FBEAF0;border:1.5px solid #F0997B55;border-radius:12px;padding:10px 14px;font-size:13px;color:#712B13;margin-bottom:14px;}
.notice.info{background:var(--paper-soft);border-color:var(--hair);color:var(--ink);}
.empty{text-align:center;padding:44px 20px;}
.empty .t{font-family:'Fraunces',serif;font-size:18px;margin-bottom:6px;}
.empty .d{font-size:14px;opacity:.6;margin-bottom:20px;line-height:1.5;}
.spinner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:10px;opacity:.55;font-size:14px;}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;flex-shrink:0;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

/* ---------- 登入頁 ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px;}
.ticket{border:1.5px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;}
.ticket-top{background:var(--paper);padding:28px 22px 24px;}
.ticket-top .kicker{font-size:11px;letter-spacing:2.5px;opacity:.55;margin-bottom:10px;}
.ticket-top .brand{font-family:'Fraunces',serif;font-size:32px;font-weight:600;line-height:1.1;}
.ticket-top .tag{font-size:13.5px;opacity:.65;margin-top:8px;line-height:1.5;}
.perf2{position:relative;height:0;border-top:2px dashed var(--line);}
.perf2::before,.perf2::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid var(--line);}
.perf2::before{left:-13px;} .perf2::after{right:-13px;}
.ticket-bottom{padding:22px;}
.tabs2{display:flex;background:var(--paper-soft);border-radius:12px;padding:3px;margin-bottom:18px;}
.tabs2 button{flex:1;border:none;background:none;padding:9px;border-radius:10px;font-size:14px;color:var(--ink);opacity:.6;cursor:pointer;}
.tabs2 button.on{background:#fff;opacity:1;font-weight:600;box-shadow:0 1px 3px #1C3A3D22;}
.or{text-align:center;font-size:12.5px;opacity:.45;margin:14px 0;}

/* ---------- App 外框 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--hair);padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.tb-main{min-width:0;cursor:pointer;}
.tb-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-title .caret{font-size:12px;opacity:.5;margin-left:4px;}
.tb-sub{font-size:12px;opacity:.5;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill{font-size:12px;border-radius:20px;padding:4px 11px;background:#E7EFE9;color:var(--good);font-weight:500;white-space:nowrap;}
.pill.end{background:var(--paper);color:var(--ink);opacity:.7;}
.main{padding:16px 18px calc(96px + env(safe-area-inset-bottom));}
.main.with-bar{padding-bottom:calc(168px + env(safe-area-inset-bottom));}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:#fffffff5;backdrop-filter:blur(8px);border-top:1px solid var(--hair);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink);opacity:.5;padding:6px 0;cursor:pointer;}
.nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav button.active{color:var(--stamp);opacity:1;font-weight:600;}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom));width:100%;max-width:480px;z-index:25;padding:14px 18px 10px;background:linear-gradient(#fff0,#fff 38%);}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:#fff;border-radius:22px;padding:10px 20px;font-size:14px;box-shadow:0 6px 20px #0003;}
.sheet-back{position:fixed;inset:0;background:#1C3A3D66;z-index:40;}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:78vh;overflow:auto;z-index:50;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));}
.sheet-handle{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;}

/* ---------- 記帳 ---------- */
.amount-card{background:var(--paper);border-radius:18px;padding:14px 18px 16px;margin-bottom:16px;}
.amount-card .lbl{font-size:12.5px;opacity:.6;margin-bottom:2px;}
.amount-row{display:flex;align-items:baseline;gap:8px;}
.amount-row .cur{font-family:'IBM Plex Mono',monospace;font-size:18px;opacity:.55;}
.amount-row input{border:none;background:transparent;padding:0;font-size:42px;font-family:'IBM Plex Mono',monospace;font-weight:500;border-radius:0;}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.cat{border:1.5px solid var(--line);border-radius:14px;padding:11px 4px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;cursor:pointer;color:var(--ink);}
.cat .ic{font-size:21px;line-height:1;}
.cat.on{border-color:var(--stamp);background:#FBF1EE;color:var(--stamp);font-weight:600;}
.seg{display:flex;background:var(--paper-soft);border-radius:12px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:10px;font-size:14px;cursor:pointer;color:var(--ink);opacity:.6;}
.seg button.on{background:#fff;opacity:1;font-weight:600;box-shadow:0 1px 3px #1C3A3D22;}
.hint{font-size:13px;opacity:.6;margin-top:10px;min-height:18px;}
.cust-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.cust-row .nm{width:64px;font-size:14px;}

/* ---------- 明細 / 統計 / 分帳 ---------- */
.summary{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;}
.big{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;}
.day{display:flex;justify-content:space-between;font-size:12.5px;opacity:.55;margin:18px 0 4px;}
.exp{padding:11px 0;border-bottom:1px solid var(--hair);cursor:pointer;}
.exp-main{display:flex;align-items:center;gap:12px;}
.exp-ic{width:38px;height:38px;border-radius:11px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.exp-note{font-size:15px;font-weight:500;}
.exp-meta{font-size:12px;opacity:.5;margin-top:1px;}
.exp-amt{font-family:'IBM Plex Mono',monospace;font-size:15.5px;font-weight:500;}
.exp-detail{margin:10px 0 2px 50px;font-size:13px;}
.exp-detail .sh{display:flex;justify-content:space-between;padding:2px 0;opacity:.8;}
.pie{width:124px;height:124px;border-radius:50%;flex-shrink:0;position:relative;}
.pie::after{content:"";position:absolute;inset:30px;background:#fff;border-radius:50%;}
table.cat-table{width:100%;border-collapse:collapse;}
table.cat-table td{padding:6px 0;font-size:13.5px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-name{width:56px;font-size:13.5px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:22px;background:var(--paper);border-radius:7px;overflow:hidden;}
.bar-fill{height:100%;border-radius:7px;}
.bar-value{width:92px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12.5px;flex-shrink:0;}
.net-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);}
.net-name{font-size:15px;font-weight:500;}
.net-meta{font-size:12px;opacity:.5;margin-top:1px;}
.net-val{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;}
.txn{display:flex;align-items:center;gap:10px;background:var(--paper-soft);border:1.5px solid var(--hair);border-radius:14px;padding:13px 15px;margin-bottom:8px;font-size:15px;}
.txn .arrow{opacity:.4;}
.txn .amt{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--stamp);}
.invite{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border-radius:12px;padding:10px 14px;margin:10px 0;}
.invite .code{font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:3px;}
.subhead{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.subhead .back{background:none;border:none;font-size:22px;color:var(--ink);cursor:pointer;padding:2px 6px 2px 0;}
.subhead h2{font-size:20px;}
code{font-family:'IBM Plex Mono',monospace;background:var(--paper-dark);padding:1px 5px;border-radius:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* ============================================================
   旅行分帳(App 版:登入 → 底部導覽列)
   一次性設定:
   1. Firebase Console → Authentication → 登入方式:啟用「電子郵件/密碼」(Google 可選)
   2. Firebase Console → Firestore → 規則:貼上 firestore.rules 的內容並發布
   3. 把下面 firebaseConfig 換成你專案的設定值
   ============================================================ */
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
// Enable only after the provider and authorized domain have been configured in Firebase.
const GOOGLE_SIGN_IN_ENABLED = false;
let loadError = null;
let initializeApp, getFirestore, doc, collection, query, where, onSnapshot, getDoc, setDoc, updateDoc,
  deleteDoc, arrayUnion, arrayRemove, writeBatch, getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, updateProfile, signOut, GoogleAuthProvider, signInWithPopup,
  setPersistence, browserLocalPersistence;
try {
  const [m1, m2, m3] = await Promise.all([
    import(FB + "firebase-app.js"), import(FB + "firebase-firestore.js"), import(FB + "firebase-auth.js")
  ]);
  ({ initializeApp } = m1);
  ({ getFirestore, doc, collection, query, where, onSnapshot, getDoc, setDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove, writeBatch } = m2);
  ({ getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } = m3);
} catch (e) { loadError = String(e && e.message || e); }

const firebaseConfig = {
  apiKey: "AIzaSyAnulHxNt4AWQVNfbBSki8Pvuw42ezmImo",
  authDomain: "tallo-a966e.firebaseapp.com",
  projectId: "tallo-a966e",
  storageBucket: "tallo-a966e.firebasestorage.app",
  messagingSenderId: "143256687624",
  appId: "1:143256687624:web:6c23f81fff079162352dbd"
};

let db = null, auth = null, firebaseReady = false;
try {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
  firebaseReady = firebaseConfig.apiKey !== "YOUR_API_KEY";
} catch (e) { firebaseReady = false; }

/* ============================================================
   共用資料與工具
   ============================================================ */
const CATEGORIES = [
  { key:"FOOD", label:"餐飲", icon:"🍜" },
  { key:"TRANSPORT", label:"交通", icon:"🚗" },
  { key:"HOTEL", label:"住宿", icon:"🛏" },
  { key:"SHOPPING", label:"購物", icon:"🛍" },
  { key:"TICKET", label:"門票", icon:"🎫" },
  { key:"OTHER", label:"其他", icon:"⋯" },
];
const CAT_COLOR = { FOOD:"#B5432E", TRANSPORT:"#A8823D", HOTEL:"#3F6650", SHOPPING:"#6B4C8A", TICKET:"#2F6690", OTHER:"#8A8474" };
const PERSON_COLORS = ["#B5432E","#A8823D","#3F6650","#6B4C8A","#2F6690","#8A8474"];
const personColor = i => PERSON_COLORS[i % PERSON_COLORS.length];

const ICON = {
  add:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`,
  list:`<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg>`,
  stats:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>`,
  settle:`<svg viewBox="0 0 24 24"><path d="M4 8h15l-3-3M20 16H5l3 3"/></svg>`,
  me:`<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4 3.4-6 7.5-6s7.5 2 7.5 6"/></svg>`,
};
const TABS = [["add","記帳"],["list","明細"],["stats","統計"],["settle","分帳"],["me","我的"]];

function today(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function uid(p){ return p + crypto.randomUUID().replace(/-/g, ""); }
function fmt(n){ const v = Math.round((n+Number.EPSILON)*10)/10; return v.toLocaleString("zh-TW",{maximumFractionDigits:1}); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sanitizeAmount(v){
  let s = v.replace(/[^0-9.]/g, "");
  const firstDot = s.indexOf(".");
  if(firstDot !== -1) s = s.slice(0, firstDot+1) + s.slice(firstDot+1).replace(/\./g, "");
  return s;
}
function genCode(){
  const a = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const r = crypto.getRandomValues(new Uint32Array(8));
  let s = ""; for(let i=0;i<8;i++) s += a[r[i] % a.length];
  return s;
}
// JSON string literal encoded for an HTML attribute; entity escaping alone is not JS escaping.
function jsArg(value){ return esc(JSON.stringify(String(value))); }
function validateTripInput(t){
  if(typeof t.name !== "string" || !t.name.trim() || t.name.length > 100) throw new Error("旅程名稱需為 1–100 字");
  if(!["進行中", "已結束"].includes(t.status)) throw new Error("旅程狀態不正確");
  if(!Array.isArray(t.members) || !t.members.length || t.members.length > 20 ||
    new Set(t.members).size !== t.members.length ||
    !t.members.every(n => typeof n === "string" && n.trim() && n.length <= 80)) throw new Error("旅伴需為 1–20 位不重複姓名（每位最多 80 字）");
}
function cleanExpense(e, id = e.id){
  return {id, date:e.date, amount:e.amount, category:e.category, note:e.note || "", payer:e.payer,
    shares:Object.fromEntries((e.participants || []).map(p => [p.name, p.amount]))};
}
function validateExpenseInput(e, members){
  if(!Number.isFinite(e.amount) || e.amount <= 0 || e.amount > 10000000) throw new Error("金額需介於 0 與一千萬元之間");
  if(typeof e.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !CATEGORIES.some(c => c.key === e.category)) throw new Error("日期或分類不正確");
  if(typeof e.note !== "string" || e.note.length > 500 || !members.includes(e.payer)) throw new Error("備註或付款人不正確");
  const ps = e.participants;
  if(!Array.isArray(ps) || !ps.length || ps.length > 20 ||
    new Set(ps.map(p => p.name)).size !== ps.length ||
    !ps.every(p => members.includes(p.name) && Number.isFinite(p.amount) && p.amount >= 0 && p.amount <= 10000000) ||
    Math.abs(ps.reduce((n,p) => n + p.amount, 0) - e.amount) >= 0.05) throw new Error("分攤金額或分攤人不正確");
}

function myName(){
  const u = auth && auth.currentUser;
  if(!u) return "我";
  return (u.displayName||"").trim() || (u.email||"我").split("@")[0];
}
function initial(n){ return esc((n||"?").trim().charAt(0).toUpperCase()); }
function fmtDay(d){
  const dt = new Date(d + "T00:00:00");
  if(isNaN(dt)) return d;
  return (dt.getMonth()+1) + "/" + dt.getDate() + " 週" + "日一二三四五六"[dt.getDay()];
}
function errMsg(e){
  const c = (e && e.code) || "";
  const m = {
    "auth/invalid-credential":"帳號或密碼錯誤",
    "auth/wrong-password":"帳號或密碼錯誤",
    "auth/user-not-found":"帳號或密碼錯誤",
    "auth/email-already-in-use":"這個 Email 已經註冊過,請直接登入",
    "auth/weak-password":"密碼至少需要 6 個字元",
    "auth/invalid-email":"Email 格式不正確",
    "auth/missing-password":"請輸入密碼",
    "auth/popup-blocked":"瀏覽器擋住了登入視窗,請允許彈出視窗後再試",
    "auth/popup-closed-by-user":"已取消登入",
    "auth/unauthorized-domain":"這個網址還沒加入 Firebase 的「授權網域」(Authentication → 設定)",
    "auth/operation-not-allowed":"此登入方式尚未啟用。請管理者在 Firebase 專案 tallo-a966e → Authentication → Sign-in method 啟用電子郵件／密碼或 Google",
    "auth/too-many-requests":"嘗試次數過多,請稍後再試",
    "auth/network-request-failed":"網路連線失敗",
    "permission-denied":"沒有權限:請確認 Firestore 規則已發布,且你是這個群組的成員"
  };
  return m[c] || (e && e.message) || "發生未知錯誤";
}
function simplifyDebts(net){
  const creditors=[], debtors=[];
  Object.entries(net).forEach(([name,amt])=>{
    if(amt>0.05) creditors.push({name,amt});
    else if(amt<-0.05) debtors.push({name,amt:-amt});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const txns=[]; let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const pay=Math.min(debtors[i].amt, creditors[j].amt);
    txns.push({from:debtors[i].name, to:creditors[j].name, amount:pay});
    debtors[i].amt-=pay; creditors[j].amt-=pay;
    if(debtors[i].amt<0.05) i++;
    if(creditors[j].amt<0.05) j++;
  }
  return txns;
}
function calc(t){
  const paid = Object.create(null), owed = Object.create(null);
  t.members.forEach(m => { paid[m] = 0; owed[m] = 0; });
  (t.expenses||[]).forEach(e => {
    paid[e.payer] = (paid[e.payer]||0) + e.amount;
    (e.participants||[]).forEach(p => { owed[p.name] = (owed[p.name]||0) + p.amount; });
  });
  const net = Object.create(null);
  Object.keys({...paid, ...owed}).forEach(m => { net[m] = (paid[m]||0) - (owed[m]||0); });
  const grand = (t.expenses||[]).reduce((s,e) => s + e.amount, 0);
  return { paid, owed, net, grand, txns: simplifyDebts(net) };
}

let unsubGroups = null, unsubTrips = null;
const expenseSubscriptions = new Map(), expenseCache = new Map();
function stopExpenses(){
  for(const unsub of expenseSubscriptions.values()) unsub();
  expenseSubscriptions.clear(); expenseCache.clear();
}
function watchExpenses(gid, trips){
  const ids = new Set(trips.map(t => t.id));
  for(const [id, unsub] of expenseSubscriptions){
    if(!ids.has(id)){ unsub(); expenseSubscriptions.delete(id); expenseCache.delete(id); }
  }
  for(const t of trips){
    if(expenseSubscriptions.has(t.id)) continue;
    expenseSubscriptions.set(t.id, onSnapshot(collection(db, "groups", gid, "trips", t.id, "expenses"), snap => {
      if(state.groupId !== gid) return;
      const docs = snap.docs.map(d => {
        const {shares, ...data} = d.data();
        return {...data, participants:Object.entries(shares || {}).map(([name, amount]) => ({name, amount})), id:d.id, _doc:true};
      });
      expenseCache.set(t.id, docs);
      state.trips = state.trips.map(x => x.id === t.id ? {...x, expenses:[...(x.expenses || []).filter(e => !e._doc), ...docs]} : x);
      render();
    }, fail));
  }
}

function subscribeGroups(uidv){
  if(unsubGroups) unsubGroups();
  unsubGroups = onSnapshot(
    query(collection(db, "groups"), where("memberUids", "array-contains", uidv)),
    (snap) => {
      state.groups = snap.docs.map(d => ({ ...d.data(), id:d.id })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      state.groupsLoaded = true;
      const want = state.wantGroup && state.groups.find(g => g.id === state.wantGroup);
      if(want){ state.wantGroup = null; selectGroup(want.id, null); return; }
      if(state.groups.length){
        if(!state.groupId || !state.groups.find(g => g.id === state.groupId)){
          const last = loadLast();
          const pick = state.groups.find(g => g.id === last.g) || state.groups[0];
          selectGroup(pick.id, pick.id === last.g ? last.t : null);
          return;
        }
      } else if(state.groupId){
        if(unsubTrips){ unsubTrips(); unsubTrips = null; }
      stopExpenses();
        state.groupId = null; state.trips = []; state.tripId = null;
      }
      render();
    },
    (err) => { state.groupsLoaded = true; state.error = errMsg(err); render(); }
  );
}
function selectGroup(gid, preferTrip){
  if(unsubTrips){ unsubTrips(); unsubTrips = null; }
      stopExpenses();
  state.groupId = gid; state.trips = []; state.tripId = null; state.tripsLoaded = false;
  state.pendingTrip = preferTrip || null; state.justCreated = null;
  unsubTrips = onSnapshot(
    collection(db, "groups", gid, "trips"),
    (snap) => {
      state.trips = snap.docs.map(d => ({ ...d.data(), id:d.id, expenses:[...(d.data().expenses || []), ...(expenseCache.get(d.id) || [])] }));
      watchExpenses(gid, state.trips);
      state.tripsLoaded = true;
      const cur = state.trips.find(t => t.id === state.tripId);
      if(cur){ if(state.justCreated === cur.id) state.justCreated = null; }
      else if(!(state.tripId && state.tripId === state.justCreated)){
        const byNew = [...state.trips].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
        const pick = state.trips.find(t => t.id === state.pendingTrip) || byNew.find(t => t.status === "進行中") || byNew[0] || null;
        state.tripId = pick ? pick.id : null;
        state.pendingTrip = null;
        saveLast();
      }
      render();
    },
    (err) => { state.tripsLoaded = true; state.error = errMsg(err); render(); }
  );
  render();
}

let savingExpense = false;
async function saveExpense(){
  if(savingExpense) return;
  const f = state.form; const t = curTrip();
  if(!t || t.status !== "進行中") return;
  const total = parseFloat(f.amount) || 0;
  if(!Number.isFinite(total) || total <= 0 || total > 10000000 || f.participants.length === 0 || f.participants.length > 20) return;
  if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(f.date) || !t.members.includes(f.payer) || !f.participants.every(p => t.members.includes(p))) return;
  let shares;
  if(f.splitMethod === "equal"){
    shares = f.participants.map(p => ({ name:p, amount: Math.round((total/f.participants.length)*10)/10 }));
    const diff = Math.round((total - shares.reduce((s,x) => s + x.amount, 0))*10)/10;
    if(diff !== 0) shares[0].amount = Math.round((shares[0].amount + diff)*10)/10;
  } else {
    const sum = f.participants.reduce((s,p) => s + (parseFloat(f.customAmounts[p])||0), 0);
    if(Math.abs(sum - total) >= 0.05) return;
    shares = f.participants.map(p => ({ name:p, amount: parseFloat(f.customAmounts[p])||0 }));
  }
  const expense = { id:uid("E"), date:f.date, amount:total, category:f.category, note:f.note.trim(), payer:f.payer, participants:shares };
  savingExpense = true;
  try { validateExpenseInput(expense, t.members); await setDoc(doc(db, "groups", state.groupId, "trips", t.id, "expenses", expense.id), cleanExpense(expense)); }
  catch(e){ fail(e); return; }
  finally { savingExpense = false; }
  state.form = {...f, amount:"", note:"", customAmounts:{}};
  toast("已記一筆 NT$ " + fmt(total));
}

function buildBackup(trips){
  const tripData = Object.create(null);
  const list = trips.map(t => {
    tripData[t.id] = { members:t.members || [], expenses:(t.expenses || []).map(({_doc, ...e}) => e) };
    return { id:t.id, name:t.name, status:t.status, createdAt:t.createdAt || 0 };
  });
  return { app:"trip-split", version:1, exportedAt:new Date().toISOString(), trips:list, tripData };
}
function downloadJSON(obj, fname){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function readLocalLegacy(){
  try {
    const trips = JSON.parse(localStorage.getItem("triptally:trips") || "[]");
    if(!Array.isArray(trips) || !trips.length) return null;
    const tripData = Object.create(null);
    trips.forEach(t => {
      let d = null;
      try { d = JSON.parse(localStorage.getItem("triptally:trip:" + t.id) || "null"); } catch(e){}
      tripData[t.id] = d || { members:["我"], expenses:[] };
    });
    return { trips, tripData };
  } catch(e){ return null; }
}
function parseBackup(text){
  if(text.length > 2000000) throw new Error("備份檔過大，請拆分後匯入");
  const o = JSON.parse(text);
  if(!o || !Array.isArray(o.trips) || typeof o.tripData !== "object" || !o.tripData) throw new Error("這不是有效的備份檔");
  return { trips:o.trips, tripData:o.tripData };
}
function prepareImport(src, me, existingIds){
  const items = []; let skipped = 0;
  const mp = n => (n === "我" ? me : n);
  src.trips.forEach(t => {
    if(!t || !t.id) return;
    if(existingIds.has(t.id)){ skipped++; return; }
    const d = src.tripData[t.id] || { members:["我"], expenses:[] };
    const members = [...new Set((d.members || []).map(mp))];
    if(!members.includes(me)) members.unshift(me);
    const expenses = (d.expenses || []).map(e => ({
      ...e, payer: mp(e.payer),
      participants: (e.participants || []).map(p => ({ name: mp(p.name), amount: p.amount }))
    }));
    expenses.forEach(e => { [e.payer, ...e.participants.map(p => p.name)].forEach(n => { if(!members.includes(n)) members.push(n); }); });
    items.push({ id:t.id, trip:{ name:t.name, status:t.status || "進行中", createdAt:t.createdAt || Date.now(), members, expenses } });
  });
  return { items, skipped };
}

  if(!p.items.length && !p.skipped){ setState({ error:"沒有找到可以匯入的旅程" }); return; }
  setState({ importPreview:p, error:"" });

function readLocalAndPreview(){
  const src = readLocalLegacy();
  if(!src){ setState({ error:"這個瀏覽器/網址下沒有找到舊資料。如果舊資料在別的網址或別的裝置,請先在舊頁面按「備份 / 匯出資料」下載備份檔,再用下方「選擇備份檔」匯入。" }); return; }
  previewFrom(src);
}
function loadBackupFile(file){
  if(!file) return;
  if(file.size > 2000000){ fail(new Error("備份檔過大，請拆分後匯入")); return; }
  const r = new FileReader();
  r.onload = () => { try { previewFrom(parseBackup(String(r.result))); } catch(e){ setState({ error:"讀取失敗:" + e.message }); } };
  r.onerror = () => setState({ error:"讀取檔案失敗" });
  r.readAsText(file);
}
function previewPasted(){
  try { previewFrom(parseBackup(state.form.importText)); } catch(e){ setState({ error:"內容不是有效的備份:" + e.message }); }
}
async function runImport(){
  if(curGroup()?.ownerUid !== state.user?.uid){ fail(new Error("只有群組擁有者可以匯入備份")); return; }
  const p = state.importPreview;
  if(!p || !p.items.length) return;
  try {
    // One atomic batch per import prevents a partially imported backup.
    const writes = p.items.reduce((n,it) => n + 1 + it.trip.expenses.length, 0);
    if(writes > 400) throw new Error("單次匯入最多 400 筆寫入，請拆分備份");
    p.items.forEach(it => {
      validateTripInput(it.trip);
      it.trip.expenses.forEach(e => validateExpenseInput(e, it.trip.members));
    });
    const batch = writeBatch(db);
    p.items.forEach(it => {
      const {expenses, ...meta} = it.trip;
      batch.set(tripRef(it.id), {...meta, expenses:[]});
      expenses.forEach(e => {
        const clean = cleanExpense(e, uid("E"));
        batch.set(doc(db, "groups", state.groupId, "trips", it.id, "expenses", clean.id), clean);
      });
    });
    await batch.commit();
    const n = p.items.length;
    setState({ importPreview:null, meSub:null });
    toast("已匯入 " + n + " 趟旅程");
  } catch(e){ fail(e); }
}
function cancelImport(){ setState({ importPreview:null }); }

function renderList(){
  if(!state.groups.length) return state.groupsLoaded ? needGroup() : loadingBlock("讀取中…");
  const t = curTrip(); if(!t) return needTrip();
  const exps = (t.expenses || []).map((e, i) => ({...e, _i:i}));
  const total = exps.reduce((s,e) => s + e.amount, 0);
  let html = `<div class="summary"><div><div class="card-sub" style="margin:0 0 2px;">旅程總支出</div><div class="big">NT$ ${fmt(total)}</div></div>
    <div class="card-sub">${exps.length} 筆</div></div>`;
  if(!exps.length) return html + `<div class="empty"><div class="d">還沒有支出紀錄。<br>到「記帳」新增第一筆吧。</div></div>`;
  exps.sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b._i - a._i));
  const days = [];
  exps.forEach(e => { let d = days.find(x => x.date === e.date); if(!d){ d = { date:e.date, items:[] }; days.push(d); } d.items.push(e); });
  days.forEach(d => {
    html += `<div class="day"><span>${esc(fmtDay(d.date))}</span><span class="mono">NT$ ${fmt(d.items.reduce((s,e) => s + e.amount, 0))}</span></div>`;
    d.items.forEach(e => {
      const cat = CATEGORIES.find(c => c.key === e.category) || CATEGORIES[5];
      const open = state.expandedId === e.id;
      html += `<div class="exp" onclick="toggleExpand(${jsArg(e.id)})"><div class="exp-main"><div class="exp-ic">${cat.icon}</div>
        <div style="flex:1;min-width:0;"><div class="exp-note">${esc(e.note || cat.label)}</div>
        <div class="exp-meta">${esc(e.payer)} 付款 · ${(e.participants||[]).length} 人分攤</div></div>
        <div class="exp-amt">${fmt(e.amount)}</div></div>`;
      if(open){
        html += `<div class="exp-detail">${(e.participants||[]).map(p => `<div class="sh"><span>${esc(p.name)}</span><span class="mono">${fmt(p.amount)}</span></div>`).join("")}
          ${t.status === "進行中" && curGroup()?.ownerUid === state.user?.uid ? `<div style="margin-top:10px;"><button class="btn danger sm" onclick="event.stopPropagation();deleteExpense(${jsArg(e.id)})">刪除這筆</button></div>` : ""}</div>`;
      }
      html += `</div>`;
    });
  });
  return html;
}

function barSection(title, members, values){
  const max = Math.max(1, ...members.map(m => values[m] || 0));
  let html = `<div class="section-label">${title}</div>`;
  members.forEach((m, i) => {
    const v = values[m] || 0;
    html += `<div class="bar-row"><div class="bar-name">${esc(m)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, v/max*100)}%;background:${personColor(i)};"></div></div>
      <div class="bar-value">NT$ ${fmt(v)}</div></div>`;
  });
  return html;
}
function renderStats(){
  if(!state.groups.length) return state.groupsLoaded ? needGroup() : loadingBlock("讀取中…");
  const t = curTrip(); if(!t) return needTrip();
  const c = calc(t);
  let html = `<div class="summary"><div><div class="card-sub" style="margin:0 0 2px;">旅程總支出</div><div class="big">NT$ ${fmt(c.grand)}</div></div>
    <div class="card-sub">${t.members.length} 人 · ${(t.expenses||[]).length} 筆</div></div>`;
  if(!(t.expenses||[]).length) return html + `<div class="empty"><div class="d">記幾筆帳之後,這裡會出現圖表。</div></div>`;
  const totals = Object.create(null);
  t.expenses.forEach(e => totals[e.category] = (totals[e.category] || 0) + e.amount);
  const rows = CATEGORIES.map(x => ({...x, amount: totals[x.key] || 0})).filter(r => r.amount > 0).sort((a,b) => b.amount - a.amount);
  let acc = 0;
  const stops = rows.map(r => { const s = acc / c.grand * 360; acc += r.amount; return `${CAT_COLOR[r.key]} ${s}deg ${acc / c.grand * 360}deg`; }).join(", ");
  html += `<div class="section-label">各分類花費</div><div class="row" style="gap:18px;align-items:center;">
    <div class="pie" style="background:conic-gradient(${stops});"></div>
    <table class="cat-table"><tbody>${rows.map(r => `<tr><td><div class="row" style="justify-content:flex-start;gap:7px;"><span class="dot" style="background:${CAT_COLOR[r.key]}"></span>${r.label}</div></td>
      <td class="mono" style="text-align:right;white-space:nowrap;">${fmt(r.amount)}</td>
      <td style="text-align:right;opacity:.55;white-space:nowrap;padding-left:10px;">${fmt(r.amount / c.grand * 100)}%</td></tr>`).join("")}</tbody></table></div>`;
  const names = t.members;
  html += barSection("每人實際花費(依分攤計算)", names, c.owed);
  html += barSection("每人實際付款(墊了多少)", names, c.paid);
  return html;
}

    <span class="badge" onclick="openSheet()">切換 ⇅</span></div>
    <div class="chips" style="margin-top:10px;">${Object.values((g && g.memberNames) || {}).map(n => chip(n, { fixed:true })).join("")}</div>
    <div class="invite"><div><div class="card-sub" style="margin:0 0 2px;">邀請碼（有效七天；過期需擁有者更新）</div><div class="code">${esc(g ? g.inviteCode : "")}</div></div>
    <button class="btn ghost sm" onclick="copyCode(${jsArg(g ? g.inviteCode : "")})">複製</button></div>
    ${g && u && g.ownerUid === u.uid ? '<button class="btn ghost sm" onclick="rotateInvite()">更新邀請碼（舊碼失效）</button>' : ''}
    </div>`;

  html += `<div class="section-label">旅程</div>`;
  if(!state.tripsLoaded) html += loadingBlock("讀取中…");
  const byNew = [...state.trips].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  byNew.forEach(x => {
    html += `<div class="card tap ${x.id === state.tripId ? "cur" : ""} ${x.status !== "進行中" ? "muted" : ""}" onclick="pickTrip(${jsArg(x.id)})">
      <div class="row"><div><div class="card-title">${esc(x.name)}</div><div class="card-sub">${esc(x.status)} · ${(x.members||[]).length} 位旅伴 · ${(x.expenses||[]).length} 筆</div></div>
      ${x.id === state.tripId ? `<span style="color:var(--stamp);font-size:18px;">✓</span>` : ""}</div></div>`;
  });
  html += `<button class="btn primary full" style="margin-top:4px;" onclick="openNewTrip()">＋ 開始新旅程</button>`;

  if(t && t.status === "進行中"){
    html += `<div class="section-label">「${esc(t.name)}」的旅伴</div><div class="chips">${t.members.map(m => chip(m, { fixed:true })).join("")}`;
    if(!state.addingMember) html += `<span class="link" style="align-self:center;" onclick="setState({addingMember:true})">＋ 新增旅伴</span>`;
    html += `</div>`;
    if(state.addingMember){
      html += `<div class="row" style="margin-top:10px;"><input id="newMemberInput" value="${esc(state.form.memberDraft)}" placeholder="新旅伴姓名(中途加入)"
        oninput="setFormSilent({memberDraft:this.value})" onkeydown="if(event.key==='Enter')addMember()">
        <button class="btn default" style="flex-shrink:0;" onclick="addMember()">加入</button>
        <button class="btn ghost" style="flex-shrink:0;" onclick="setState({addingMember:false})">✕</button></div>
        <div class="card-sub" style="margin-top:6px;">中途加入不影響之前的支出,之後的新支出才能選到他。</div>`;
    }
  }

  html += groupForms();
  html += `<div class="section-label">資料</div><div class="row">
    <button class="btn ghost" style="flex:1;" onclick="openImport()">📥 匯入舊資料</button>
    <button class="btn ghost" style="flex:1;" onclick="exportGroup()">💾 匯出備份</button></div>`;
  return html;
}
function renderNewTrip(){
  const f = state.form;
  const hasActive = state.trips.some(t => t.status === "進行中");
  let html = `<div class="subhead"><button class="back" onclick="setState({meSub:null})">‹</button><h2>開始新旅程</h2></div>`;
  if(hasActive) html += `<div class="notice">目前已有進行中的旅程。建立新旅程不會影響它,兩趟旅程的帳完全獨立。</div>`;
  html += `<div class="field"><div class="field-label">旅程名稱</div>
    <input id="tripNameInput" value="${esc(f.newTripName)}" placeholder="例如:東京 2026"
      oninput="setFormSilent({newTripName:this.value}); document.getElementById('createTripBtn').disabled = !this.value.trim();"></div>`;
  html += `<div class="field"><div class="field-label">旅伴(預設帶入群組成員,可移除;也能加沒有帳號的人)</div>
    <div class="row" style="margin-bottom:10px;"><input id="memberDraftInput" value="${esc(f.newTripDraft)}" placeholder="輸入旅伴姓名"
      oninput="setFormSilent({newTripDraft:this.value})" onkeydown="if(event.key==='Enter')addTripMember()">
      <button class="btn default" style="flex-shrink:0;" onclick="addTripMember()">＋</button></div>
    <div class="chips">${chip(myName() + "(我)", { fixed:true })}${f.newTripMembers.map(m => chip(m, { onRemove:`removeTripMember(${jsArg(m)})` })).join("")}</div></div>`;
  html += `<button id="createTripBtn" class="btn primary full" ${!f.newTripName.trim() ? "disabled" : ""} onclick="createTrip()">建立旅程</button>`;
  return html;
}
function renderImport(){
  const g = curGroup(); const p = state.importPreview; const f = state.form;
  let html = `<div class="subhead"><button class="back" onclick="closeImport()">‹</button><h2>匯入舊資料</h2></div>`;
  html += `<div class="notice info">匯入只會「複製」資料到群組「${esc(g ? g.name : "")}」,原本的資料不會被刪除或修改。舊資料裡的「我」會換成你的名字(${esc(myName())})。已經匯入過的旅程會自動略過,不會重複。</div>`;
  if(p){
    html += `<div class="section-label">將匯入 ${p.items.length} 趟旅程${p.skipped ? `(另有 ${p.skipped} 趟已存在,略過)` : ""}</div>`;
    p.items.forEach(it => {
      const total = it.trip.expenses.reduce((s,e) => s + (e.amount||0), 0);
      html += `<div class="card"><div class="card-title">${esc(it.trip.name)}</div>
        <div class="card-sub">${it.trip.expenses.length} 筆支出 · 總額 NT$ ${fmt(total)} · ${esc(it.trip.members.join("、"))}</div></div>`;
    });
    html += `<div class="row" style="margin-top:14px;"><button class="btn primary" style="flex:1;" ${p.items.length ? "" : "disabled"} onclick="runImport()">確認匯入</button>
      <button class="btn ghost" style="flex:1;" onclick="cancelImport()">取消</button></div>`;
    return html;
  }
  html += `<div class="section-label">方式一:讀取這個瀏覽器裡的舊資料</div><button class="btn default full" onclick="readLocalAndPreview()">讀取舊資料</button>`;
  html += `<div class="section-label">方式二:選擇備份檔 (.json)</div><input type="file" accept=".json,application/json" onchange="loadBackupFile(this.files[0])">`;
  html += `<div class="section-label">方式三:貼上備份文字</div>
    <textarea id="importTextArea" placeholder="把備份的 JSON 文字貼在這裡" oninput="setFormSilent({importText:this.value})">${esc(f.importText)}</textarea>
    <button class="btn default full" style="margin-top:10px;" onclick="previewPasted()">預覽</button>`;
  return html;
}

/* ============================================================
   總繪製
   ============================================================ */
function render(){
  if(composing){ pendingRender = true; return; }
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  const selStart = (active && typeof active.selectionStart === "number") ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === "number") ? active.selectionEnd : null;
  const scrollY = window.scrollY;

  let html = "";
  if(state.screen === "boot") html = loadingBlock("連線中…");
  else if(state.screen === "setup") html = renderSetupNeeded();
  else if(state.screen === "login") html = renderLogin();
  else {
    let body = "";
    switch(state.tab){
      case "add": body = renderAdd(); break;
      case "list": body = renderList(); break;
      case "stats": body = renderStats(); break;
      case "settle": body = renderSettle(); break;
      case "me": body = renderMe(); break;
    }
    const err = state.error ? `<div class="notice" style="display:flex;justify-content:space-between;gap:10px;"><span>${esc(state.error)}</span><span style="cursor:pointer;" onclick="clearError()">✕</span></div>` : "";
    const bar = renderSaveBar();
    html = renderTopbar() + `<div class="main ${bar ? "with-bar" : ""}">${err}${body}</div>` + bar + renderNav() + renderSheet()
      + (state.toast ? `<div class="toast">${esc(state.toast)}</div>` : "");
  }
  document.getElementById("app").innerHTML = html;

  if(state.screen === "app" && state.tab === "add") refreshAdd();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus({ preventScroll:true });
      if(selStart !== null && typeof el.setSelectionRange === "function"){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
  if(Math.abs(window.scrollY - scrollY) > 1) window.scrollTo(0, scrollY);
}
document.addEventListener("compositionstart", () => { composing = true; });
document.addEventListener("compositionend", () => {
  composing = false;
  if(pendingRender){ pendingRender = false; setTimeout(render, 0); }
});

function boot(){
  if(!firebaseReady){ setState({ screen:"setup" }); return; }
  startAuth();
}

Object.assign(window, {
  setState, setForm, setFormSilent, clearError,
  doLogin, doSignup, submitAuth, doGoogle, doLogout,
  createGroup, joinGroup, rotateInvite, copyCode, pickGroup, pickTrip, openSheet, closeSheet, goTab,
  openNewTrip, addTripMember, removeTripMember, createTrip, endTrip, reopenTrip, addMember,
  toggleExpand, deleteExpense, onAmount, onCustom, toggleParticipant, toggleAllParticipants, saveExpense,
  exportGroup, openImport, closeImport, readLocalAndPreview, loadBackupFile, previewPasted, runImport, cancelImport,
});

render();
boot();

</script>
</body>
</html>
